# Move to .github/workflows/ci.yml to enable (the pushing token lacked the `workflow` scope).
name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Unit tests + integration tests (Testcontainers spins up Postgres & Redis via the runner's Docker)
      - run: mvn -B verify
      - run: docker build -t aeroops-java:ci .
